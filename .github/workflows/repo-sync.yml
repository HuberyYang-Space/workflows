name: Repo Files Sync

on:
  push:
    branches:
      - main
    paths:
      - 'LICENSE'
  workflow_dispatch:

jobs:
  sync-to-repos:
    name: 同步LICENSE到指定仓库
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 在这里明确列出要同步的目标仓库
        repo:
          - 'HuberyYang-Space/ai-news-digest'
          - 'HuberyYang-Space/about-me-react'
          - 'HuberyYang-Space/about-me-vue3'
          - 'HuberyYang-Space/frontend-forest'
          - 'HuberyYang-Space/about-me'
          - 'HuberyYang-Space/equals-demo'
          - 'HuberyYang-Space/my-blog'
          - 'HuberyYang-Space/todo-scripts'

      fail-fast: false
    
    steps:
      - name: Checkout 源仓库
        uses: actions/checkout@v5
        with:
          path: source
      
      - name: Checkout 目标仓库
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.REPO_SYNC_TOKEN }}
          path: target
      
      - name: 同步 LICENSE
        run: |
          echo "开始同步LICENSE到 ${{ matrix.repo }}"
          
          if [ -f "source/LICENSE" ]; then
            echo "同步 LICENSE"
            cp source/LICENSE target/
          fi
          
          echo "同步完成"
      
      - name: 提交并推送变更
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add LICENSE
          
          if git diff --staged --quiet; then
            echo "没有检测到文件变更，跳过提交"
            echo "SYNC_STATUS=no_changes" >> $GITHUB_ENV
          else
            echo "检测到文件变更，准备提交"
            git commit -m "chore: synchronize files from workflows repo

          自动从 ${{ github.repository }} 同步更新
          源提交: ${{ github.sha }}
          触发事件: ${{ github.event_name }}"
            
            git push origin HEAD:main
            
            echo "SYNC_STATUS=synced" >> $GITHUB_ENV
            echo "✅ 变更已成功推送到 ${{ matrix.repo }}"
          fi
      
      - name: 同步结果摘要
        if: always()
        run: |
          if [ "${{ env.SYNC_STATUS }}" == "synced" ]; then
            echo "::notice::成功同步文件到 ${{ matrix.repo }}"
          elif [ "${{ env.SYNC_STATUS }}" == "no_changes" ]; then
            echo "::notice::${{ matrix.repo }} 无需更新，文件已是最新"
          else
            echo "::warning::${{ matrix.repo }} 同步状态未知"
          fi